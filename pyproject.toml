[project]
name = "poecraft"
version = "0.1.0"
description = "Path of Exile 1 crafting simulator / calculator with a recipe language"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
poecraft = "poecraft.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
